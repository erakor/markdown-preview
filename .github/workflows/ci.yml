name: CI

on:
  push:
  pull_request:

jobs:
  renderer:
    name: Renderer (build + Playwright WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed bundle must be up to date
        working-directory: .
        run: |
          git status --porcelain -- App/Resources/Renderer
          test -z "$(git status --porcelain -- App/Resources/Renderer)" || { echo "::error::App/Resources/Renderer is stale. Run 'cd renderer && npm run build' and commit."; exit 1; }
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit --trace off

  macos:
    name: macOS app (xcodegen + build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild -scheme MarkdownPreview -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" build test > xcodebuild.log 2>&1 \
            || { echo '--- errors and failures ---'; grep -nE 'error:|failed|FAILED|Assertion' xcodebuild.log | head -n 80; exit 1; }
        shell: bash
      - name: Release build for download
        run: |
          xcodebuild -scheme MarkdownPreview -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" build
          ditto -c -k --keepParent build/Build/Products/Release/MarkdownPreview.app MarkdownPreview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownPreview-app
          path: MarkdownPreview.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
