name: CI

on:
  push:
    branches: [main, claude/sharp-albattani-791ird]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and format for renderer/, the job every erakor JS repo shares. Pinned to a toolchain
  # commit, the same one renderer/package.json installs.
  checks:
    name: Renderer checks (lint + format)
    uses: erakor/toolchain/.github/workflows/node-checks.yml@f932e1de2de8b7ab49f81be1b68339731d88b3d0
    with:
      working-directory: renderer

  renderer:
    name: Renderer (build + Playwright WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: renderer/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: renderer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Committed bundle must be up to date
        working-directory: .
        run: |
          stale=$(git status --porcelain -- App/Resources/Renderer)
          [ -z "$stale" ] || { echo "$stale"; echo "::error::App/Resources/Renderer is stale. Run 'cd renderer && pnpm build' and commit."; exit 1; }
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e --project=webkit --trace off

  # Style, from .swift-format (a copy of erakor/toolchain's). Strict: any finding fails the job.
  # Pinned to a commit on the toolchain's main.
  swift-format:
    name: swift-format lint
    uses: erakor/toolchain/.github/workflows/swift-checks.yml@f932e1de2de8b7ab49f81be1b68339731d88b3d0
    with:
      paths: App Tests
      strict: true

  macos:
    name: macOS app (xcodegen + build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild -scheme MarkdownPreview -destination 'platform=macOS' \
            -derivedDataPath build build test > xcodebuild.log 2>&1 \
            || { echo '--- errors and failures ---'; grep -nE 'error:|failed|FAILED|Assertion' xcodebuild.log | head -n 80; exit 1; }
        shell: bash
      - name: Release build for download
        run: |
          xcodebuild -scheme MarkdownPreview -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build build
          ditto -c -k --keepParent build/Build/Products/Release/MarkdownPreview.app MarkdownPreview.zip
      - uses: actions/upload-artifact@v7
        with:
          name: MarkdownPreview-app
          path: MarkdownPreview.zip
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
