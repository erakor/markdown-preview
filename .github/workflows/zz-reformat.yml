# TEMPORARY: runs swift-format on macOS and prints the patch (gzip+base64) in the log.
# Removed again in the next commit.
name: zz-reformat
on:
  push:
    branches: [claude/sharp-albattani-791ird]
permissions:
  contents: read
jobs:
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Format
        env:
          PATHS: App Tests
        run: |
          xcrun swift-format --version
          xcrun swift-format format --in-place --recursive $PATHS
          git diff --numstat | awk '{a+=$1; d+=$2; f++} END {print "FILES", f, "ADDED", a, "DELETED", d}'
          echo "LINT-AFTER-BEGIN"
          xcrun swift-format lint --recursive $PATHS 2>&1 | tee /tmp/after.txt | tail -400 || true
          echo "LINT-AFTER-COUNT $(wc -l < /tmp/after.txt)"
          head -c 160000 /dev/zero | tr "\0" "x" | fold -w 200
          echo "PATCH-BEGIN"
          git diff | gzip -9 | base64 | fold -w 3000
          echo "PATCH-END"
